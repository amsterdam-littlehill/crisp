name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test

      - name: Validate crp.yaml schema
        run: bun src/cli.ts validate

      - name: Init temp project and create skill
        run: |
          mkdir /tmp/test-project
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts init --project test-project
          bun $GITHUB_WORKSPACE/src/cli.ts skill create test-skill --description "CI fixture"
          bun $GITHUB_WORKSPACE/src/cli.ts sync

      # crp skill check validates a skill against the SkillSpec (the single
      # source of truth in src/lib/skill/spec.ts). A freshly scaffolded skill
      # passes with warnings only (FILL markers + placeholders are author
      # TODOs); errors indicate real structural drift between the template
      # and the spec. The spec is aligned to templates/skill as canonical.
      - name: Verify skill check passes on fresh scaffold
        run: |
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts skill check test-skill

      - name: Run health-check
        run: |
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts check

      - name: Run token-audit
        run: |
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts audit

      - name: Test sync dry-run
        run: |
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts sync --check

      - name: Test install.sh --dry-run
        run: |
          mkdir /tmp/dry-run-test
          cd /tmp/dry-run-test
          bash $GITHUB_WORKSPACE/install.sh --dry-run
          if [[ -d .claude ]]; then
            echo "--dry-run created files"
            exit 1
          fi
          echo "--dry-run respected"

      - name: Test multi-skill flow
        run: |
          mkdir /tmp/multi-skill-test
          cd /tmp/multi-skill-test
          bun $GITHUB_WORKSPACE/src/cli.ts init --project multi-test
          bun $GITHUB_WORKSPACE/src/cli.ts skill create backend --description "Backend"
          bun $GITHUB_WORKSPACE/src/cli.ts skill create frontend --description "Frontend"
          bun $GITHUB_WORKSPACE/src/cli.ts sync
          bun $GITHUB_WORKSPACE/src/cli.ts check
          bun $GITHUB_WORKSPACE/src/cli.ts audit
          bun $GITHUB_WORKSPACE/src/cli.ts skill list
