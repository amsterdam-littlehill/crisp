name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test

      - name: Validate crp.yaml schema
        run: bun src/cli.ts validate

      - name: Init temp project and create skill
        run: |
          mkdir /tmp/test-project
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts init --project test-project
          bun $GITHUB_WORKSPACE/src/cli.ts skill create test-skill --description "CI fixture"
          bun $GITHUB_WORKSPACE/src/cli.ts sync

      # The smoke-test is an author tool (48 checks against a filled-in skill).
      # A fresh template intentionally leaves sections (hooks/, "Always Read",
      # "Core Principles") for the author, so it reports FAILs on a scaffold.
      # The CI contract worth enforcing here is that the shipped script EXECUTES
      # (exit 0 = passed, 1 = failed checks = expected on fresh template,
      # 2+/127 = broken script). Assert executability without continue-on-error.
      - name: Verify smoke-test script executes
        run: |
          cd /tmp/test-project
          set +e
          bash .claude/skills/test-skill/scripts/smoke-test.sh test-skill > /tmp/smoke.out 2>&1
          code=$?
          cat /tmp/smoke.out
          if [ "$code" -ge 2 ]; then
            echo "::error::smoke-test script broken (exit $code)"
            exit 1
          fi
          echo "smoke-test executed cleanly (exit $code, expected 0 or 1 on fresh template)"

      - name: Run health-check
        run: |
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts check

      - name: Run token-audit
        run: |
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts audit

      - name: Test sync dry-run
        run: |
          cd /tmp/test-project
          bun $GITHUB_WORKSPACE/src/cli.ts sync --check

      - name: Test install.sh --dry-run
        run: |
          mkdir /tmp/dry-run-test
          cd /tmp/dry-run-test
          bash $GITHUB_WORKSPACE/install.sh --dry-run
          if [[ -d .claude ]]; then
            echo "--dry-run created files"
            exit 1
          fi
          echo "--dry-run respected"

      - name: Test multi-skill flow
        run: |
          mkdir /tmp/multi-skill-test
          cd /tmp/multi-skill-test
          bun $GITHUB_WORKSPACE/src/cli.ts init --project multi-test
          bun $GITHUB_WORKSPACE/src/cli.ts skill create backend --description "Backend"
          bun $GITHUB_WORKSPACE/src/cli.ts skill create frontend --description "Frontend"
          bun $GITHUB_WORKSPACE/src/cli.ts sync
          bun $GITHUB_WORKSPACE/src/cli.ts check
          bun $GITHUB_WORKSPACE/src/cli.ts audit
          bun $GITHUB_WORKSPACE/src/cli.ts skill list
